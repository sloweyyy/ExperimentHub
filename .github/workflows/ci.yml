name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check formatting (Black)
        run: cd backend && python -m black --check .

      - name: Check import sorting (isort)
        run: cd backend && python -m isort --check .

      - name: Lint (Flake8)
        run: cd backend && python -m flake8 .

      - name: Type check (mypy)
        run: cd backend && python -m mypy app/ models/

      - name: Run tests
        run: cd backend && python -m pytest --cov=app --cov=models --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: experimenthub/package-lock.json

      - name: Install dependencies
        run: cd experimenthub && npm ci

      - name: Lint (ESLint)
        run: cd experimenthub && npm run lint

      - name: Type check (TypeScript)
        run: cd experimenthub && npx tsc --noEmit

      - name: Run tests
        run: cd experimenthub && npm test -- --coverage --watchAll=false

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t experimenthub-backend .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t experimenthub-frontend .
